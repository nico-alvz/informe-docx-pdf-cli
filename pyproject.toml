[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "informe-docx-pdf-cli"
version = "1.0.0"
description = "Convierte un informe DOCX y sus anexos DOCX/PDF en un PDF final."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pypdf>=6.0,<7"]

[project.scripts]
informe-pdf = "informe_pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
