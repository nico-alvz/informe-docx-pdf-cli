name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -v
      - name: Check tag matches package version
        run: python -c 'import os, informe_pdf; assert os.environ["GITHUB_REF_NAME"] == "v" + informe_pdf.__version__'
      - run: python -m build
      - name: Checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
